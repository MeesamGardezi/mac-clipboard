<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF7A2F"/>
      <stop offset="100%" stop-color="#E84800"/>
    </radialGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C3A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#CC4400" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="600" height="600" rx="130" ry="130" fill="url(#bgGrad)"/>

  <!-- Clipboard handle (white outer) -->
  <rect x="215" y="90" width="170" height="82" rx="41" ry="41" fill="white"/>

  <!-- Clipboard handle inner cutout (orange pill) -->
  <rect x="247" y="112" width="106" height="38" rx="19" ry="19" fill="#E85C00"/>

  <!-- Clipboard body (white border) -->
  <rect x="110" y="145" width="380" height="360" rx="36" ry="36"
        fill="url(#clipGrad)"
        stroke="white" stroke-width="14"/>

  <!-- Text lines -->
  <rect x="152" y="228" width="272" height="22" rx="11" fill="white" opacity="0.55"/>
  <rect x="152" y="274" width="272" height="22" rx="11" fill="white" opacity="0.45"/>
  <rect x="152" y="320" width="220" height="22" rx="11" fill="white" opacity="0.38"/>
  <rect x="152" y="366" width="190" height="22" rx="11" fill="white" opacity="0.30"/>

  <!-- ⌘V+ badge bottom right -->
  <rect x="362" y="432" width="108" height="44" rx="14" fill="white" opacity="0.25"/>
  <text x="416" y="461" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="22" font-weight="600" fill="white" text-anchor="middle" opacity="0.95">⌘V+</text>
</svg>
