<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" fill="none">
  <defs>
    <!-- Orange gradient for icon -->
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A29"/>
      <stop offset="100%" stop-color="#E84D00"/>
    </linearGradient>
    <!-- Subtle shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#FF5C00" flood-opacity="0.28"/>
    </filter>
    <!-- Text shadow -->
    <filter id="textShadow" x="-2%" y="-5%" width="104%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <!-- Clip path for icon rounded rect -->
    <clipPath id="iconClip">
      <rect x="0" y="0" width="100" height="100" rx="22"/>
    </clipPath>
  </defs>

  <!-- ── Icon mark ── -->
  <g transform="translate(24, 30)" filter="url(#shadow)">
    <!-- Background rounded square -->
    <rect width="100" height="100" rx="22" fill="url(#iconGrad)"/>

    <!-- Subtle gloss top highlight -->
    <rect width="100" height="50" rx="22" fill="white" opacity="0.08" clip-path="url(#iconClip)"/>

    <!-- Clipboard body -->
    <rect x="22" y="28" width="56" height="54" rx="7" fill="white" opacity="0.18"/>
    <rect x="22" y="28" width="56" height="54" rx="7" fill="none" stroke="white" stroke-width="2.2" opacity="0.9"/>

    <!-- Clipboard clip (top bar) -->
    <rect x="36" y="20" width="28" height="14" rx="5" fill="white" opacity="0.95"/>
    <!-- Clip hole -->
    <rect x="43" y="23" width="14" height="5" rx="2.5" fill="url(#iconGrad)"/>

    <!-- Lines on clipboard (content) -->
    <rect x="31" y="44" width="38" height="3" rx="1.5" fill="white" opacity="0.7"/>
    <rect x="31" y="52" width="30" height="3" rx="1.5" fill="white" opacity="0.5"/>
    <rect x="31" y="60" width="34" height="3" rx="1.5" fill="white" opacity="0.35"/>

    <!-- Stack effect: second clipboard (offset behind) -->
    <rect x="27" y="32" width="56" height="54" rx="7" fill="none" stroke="white" stroke-width="1.5" opacity="0.25" transform="translate(5, -3)"/>
  </g>

  <!-- ── Wordmark ── -->
  <!-- "ma" in lighter weight -->
  <text
    x="148"
    y="108"
    font-family="'SF Pro Display', 'Helvetica Neue', -apple-system, sans-serif"
    font-size="68"
    font-weight="300"
    letter-spacing="-3"
    fill="#1A1A1A"
    filter="url(#textShadow)"
  >ma</text>

  <!-- "Clip" in bold orange -->
  <text
    x="256"
    y="108"
    font-family="'SF Pro Display', 'Helvetica Neue', -apple-system, sans-serif"
    font-size="68"
    font-weight="800"
    letter-spacing="-3"
    fill="#FF5C00"
    filter="url(#textShadow)"
  >Clip</text>

  <!-- Tagline -->
  <text
    x="149"
    y="130"
    font-family="'SF Mono', 'JetBrains Mono', monospace"
    font-size="13"
    font-weight="500"
    letter-spacing="2.5"
    fill="#9A9A9A"
  >CLIPBOARD MANAGER FOR MACOS</text>
</svg>
