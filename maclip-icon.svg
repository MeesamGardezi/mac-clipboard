<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FF7A29"/>
      <stop offset="100%" stop-color="#D94400"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="innerShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="iconBg">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- macOS-style rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Top sheen -->
  <rect width="512" height="256" rx="112" fill="url(#sheen)" clip-path="url(#iconBg)"/>

  <!-- Subtle noise texture overlay via repeating circles (depth) -->
  <rect width="512" height="512" rx="112" fill="none" stroke="white" stroke-width="1" opacity="0.06"/>

  <!-- ── Main clipboard body ── -->
  <g filter="url(#innerShadow)">
    <!-- Primary clipboard -->
    <rect x="118" y="148" width="276" height="290" rx="34" fill="white" opacity="0.16"/>
    <rect x="118" y="148" width="276" height="290" rx="34" stroke="white" stroke-width="10" fill="none" opacity="0.92"/>

    <!-- Second clipboard stacked behind (depth) -->
    <rect x="140" y="122" width="276" height="290" rx="34" stroke="white" stroke-width="7" fill="none" opacity="0.22"/>

    <!-- Clip at top -->
    <rect x="192" y="104" width="128" height="72" rx="24" fill="white" opacity="0.95"/>
    <!-- Clip hole -->
    <rect x="216" y="120" width="80" height="28" rx="12" fill="url(#bg)"/>

    <!-- Content lines -->
    <rect x="154" y="232" width="200" height="16" rx="8" fill="white" opacity="0.72"/>
    <rect x="154" y="264" width="156" height="16" rx="8" fill="white" opacity="0.52"/>
    <rect x="154" y="296" width="176" height="16" rx="8" fill="white" opacity="0.38"/>
    <rect x="154" y="328" width="130" height="16" rx="8" fill="white" opacity="0.25"/>

    <!-- Small ⌘ hint badge bottom-right -->
    <rect x="282" y="370" width="84" height="34" rx="10" fill="white" opacity="0.18"/>
    <text x="300" y="393" font-family="-apple-system, sans-serif" font-size="18" fill="white" opacity="0.85" font-weight="600">⌘V+</text>
  </g>
</svg>
